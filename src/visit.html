<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src {{csp.imgSrc}}; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Επίσκεψη | Afra's Chop Shop, Λαμία</title>
  <meta name="description" content="{{address.street}}, {{address.city}} ({{address.area}}). Τηλ. {{phone}}. Ωράριο: {{hours.summary}}.">
{{> head}}
  <meta property="og:title" content="Επίσκεψη · Afra's Chop Shop">
  <meta property="og:description" content="{{address.street}}, {{address.city}}. Τηλ. {{phone}}. {{hours.summary}}.">

{{> assets}}
</head>
<body class="is-dark">
{{> header}}

  <main id="main" tabindex="-1">
    <section class="page-head theme-ink" aria-labelledby="visit-title">
      <div class="wrap">
        <p class="label hero__kicker">Επίσκεψη</p>
        <h1 class="display page-head__title" id="visit-title">Πού θα μας βρεις</h1>
      </div>
    </section>

    <section class="section theme-charcoal">
      <div class="wrap">
        <div class="visit">
          <div class="hours">
            <p class="label hours__notch" aria-hidden="true">Ωράριο</p>
            <p class="open-status" data-open-status="{{hours.statusData}}"></p>
            <table class="hours__table" data-hours>
              <caption class="visually-hidden">Ωράριο λειτουργίας</caption>
              <thead class="visually-hidden">
                <tr><th scope="col">Ημέρα</th><th scope="col">Ώρες</th></tr>
              </thead>
              <tbody>
                {{hours.table}}
              </tbody>
            </table>
          </div>

          <address class="place">
            <p class="display place__street"><span>{{address.street}}</span> <span>{{address.postalCode}} {{address.city}}</span></p>
            <p class="label place__area">{{address.area}}</p>
            <div class="place__actions">
              <a class="btn btn--line" href="https://www.google.com/maps/search/?api=1&amp;query={{address.mapsQuery}}" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="#i-pin"/></svg>Οδηγίες στον χάρτη<svg class="icon icon--sm" aria-hidden="true"><use href="#i-arrow"/></svg><span class="visually-hidden"> (ανοίγει σε νέα καρτέλα)</span></a>
              <a class="btn btn--line" href="tel:{{phone.tel}}" aria-label="Πάρε τηλέφωνο στο {{phone}}"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>Πάρε τηλέφωνο</a>
            </div>
          </address>
        </div>
      </div>
    </section>

{{> band}}
  </main>

{{> footer}}
</body>
</html>
