<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Τιμές | Afra's Chop Shop, Λαμία</title>
  <meta name="description" content="Τιμές στο Afra's Chop Shop, {{address.city}}: κούρεμα {{prices.haircut.price}} €, περιποίηση γενειάδας {{prices.beard.price}} €, κούρεμα και γενειάδα {{prices.combo.price}} €. Κλείσε ώρα online στο Setmore.">
{{> head}}
  <meta property="og:title" content="Τιμές · Afra's Chop Shop">
  <meta property="og:description" content="Κούρεμα {{prices.haircut.price}} €, γενειάδα {{prices.beard.price}} €, κούρεμα και γενειάδα {{prices.combo.price}} €. Κλείσε ώρα online στο Setmore.">

{{> assets}}
</head>
<body class="is-dark">
{{> header}}

  <main id="main" tabindex="-1">
    <section class="page-head theme-ink" aria-labelledby="prices-title">
      <div class="wrap">
        <p class="label hero__kicker">Τιμές</p>
        <h1 class="display page-head__title" id="prices-title">Τι κάνουμε, πόσο κάνει</h1>
      </div>
    </section>

    <section class="section theme-charcoal">
      <div class="wrap">
        <div class="board-wrap">
          <ul role="list" class="board">
{{prices.board}}
          </ul>
          <a class="btn btn--book btn--block board__cta" href="{{links.booking}}" target="_blank" rel="noopener">Κλείσε ώρα<svg class="icon icon--sm" aria-hidden="true"><use href="#i-arrow"/></svg><span class="visually-hidden"> (ανοίγει σε νέα καρτέλα)</span></a>
          <p class="board__note">Μετρητά ή κάρτα.</p>
        </div>
      </div>
    </section>

{{> band}}
  </main>

{{> footer}}
</body>
</html>
