<!doctype html>
<html lang="el">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'none'; font-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="robots" content="noindex">
  <title>Δεν βρέθηκε η σελίδα · Afra's Chop Shop</title>
  <link rel="icon" href="{{website.path}}assets/img/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{website.path}}assets/img/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{website.path}}assets/img/favicon-16x16.png">
  <link rel="apple-touch-icon" href="{{website.path}}assets/img/apple-touch-icon.png">
  <link rel="manifest" href="{{website.path}}manifest.webmanifest">
  <link rel="preload" href="{{website.path}}assets/fonts/manrope-greek-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{{website.path}}{{asset.css}}">
</head>
<body>
  <svg hidden>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path vector-effect="non-scaling-stroke" d="M6 18L18 6M8 6h10v10"/></symbol>
  </svg>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="site-header__logo" href="{{website.path}}" aria-label="Afra's Chop Shop, αρχική σελίδα">
        <img class="logo logo--paper" src="{{website.path}}assets/img/afraslogo-trim.webp" width="845" height="377" alt="Afra's Chop Shop, Stay Fresh">
      </a>
    </div>
  </header>

  <main class="notfound">
    <div class="wrap">
      <div class="frame hero__frame">
        <p class="label">Σφάλμα 404</p>
        <h1 class="display hero__title">Εδώ δεν κόβουμε τίποτα.</h1>
        <p class="notfound__text">Η σελίδα που ψάχνεις δεν υπάρχει ή άλλαξε διεύθυνση.</p>
        <div class="hero__actions">
          <a class="btn btn--book btn--block" href="{{links.booking}}" target="_blank" rel="noopener">Κλείσε ώρα<svg class="icon icon--sm" width="16" height="16" aria-hidden="true"><use href="#i-arrow"/></svg><span class="visually-hidden"> (ανοίγει σε νέα καρτέλα)</span></a>
          <a class="icon-link" href="{{website.path}}">Πίσω στην αρχική</a>
        </div>
        <p class="label frame__notch">Stay Fresh</p>
      </div>
    </div>
  </main>
</body>
</html>
