<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 112" width="48" height="112">
  <defs>
    <linearGradient id="body" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#050506"/>
      <stop offset="0.3" stop-color="#17171A"/>
      <stop offset="1" stop-color="#030303"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="0.35" stop-color="#232326"/>
      <stop offset="1" stop-color="#090909"/>
    </linearGradient>
  </defs>

  <!-- blade: black with silver rim and teeth lines -->
  <path d="M10 15 L11 3 Q24 0.5 37 3 L38 15 Z" fill="url(#blade)" stroke="#9AA0A8" stroke-width="0.9" stroke-linejoin="round"/>
  <g stroke="#9AA0A8" stroke-width="0.9" stroke-linecap="round">
    <path d="M14.5 3V9"/><path d="M19.3 2.2V9"/><path d="M24 2V9"/><path d="M28.7 2.2V9"/><path d="M33.5 3V9"/>
  </g>

  <!-- body: black with thin silver rim -->
  <path d="M9 15 H39 Q41 15 41 18 L41.5 82 Q41.5 106 24 109 Q6.5 106 6.5 82 L7 18 Q7 15 9 15 Z"
        fill="url(#body)" stroke="#9AA0A8" stroke-width="1" stroke-linejoin="round"/>

  <!-- soft highlight -->
  <path d="M12 26 V88" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.14"/>

  <!-- power button -->
  <circle cx="24" cy="34" r="4" fill="none" stroke="#9AA0A8" stroke-width="1"/>
  <circle cx="24" cy="34" r="1.5" fill="#9AA0A8"/>
</svg>
